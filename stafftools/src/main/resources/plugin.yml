name: StaffTools
version: '1.1.0'
main: com.example.stafftools.StaffTools
api-version: '1.21'
author: Claude
description: Beheer-tag en eigen prefixes (/prefix) in tab/chat, /report commando zichtbaar voor beheer, en Discord-logging via webhook.

commands:
  report:
    description: Meld een speler of probleem bij de beheerders.
    usage: /report <speler> <reden>
    permission: stafftools.report
  sgm:
    description: Stuur een priv\u00e9bericht als beheer naar een speler.
    usage: /sgm <speler> <bericht>
    permission: stafftools.staff
  staffchat:
    description: Chat die alleen beheer (OP) ziet. Zonder bericht = aan/uit.
    usage: /staffchat [bericht]
    aliases: [sc]
    permission: stafftools.staff
  staffmode:
    description: Onzichtbaar meekijken als toeschouwer (aan/uit), daarna terug naar je plek.
    usage: /staffmode
    aliases: [sm]
    permission: stafftools.staff
  staffcreative:
    description: Tijdelijk creative met een lege inventory; je survival-spullen blijven veilig.
    usage: /staffcreative
    aliases: [screative, scr]
    permission: stafftools.staff
  spectate:
    description: Staffmode aan en meteen naar een speler.
    usage: /spectate <speler>
    aliases: [spec]
    permission: stafftools.staff
  invsee:
    description: Bekijk (en pas aan) de inventory van een online speler.
    usage: /invsee <speler>
    permission: stafftools.staff
  endersee:
    description: Bekijk (en pas aan) de enderkist van een online speler.
    usage: /endersee <speler>
    permission: stafftools.staff
  brig:
    description: Zet een speler een tijdje vast op de brig-plek (daarna naar spawn).
    usage: /brig <speler> [tijd] [reden] | vrij <speler> | list | set
    permission: stafftools.staff
  pumpkin:
    description: Zet een pompoen op iemands hoofd (eigen helm komt daarna terug).
    usage: /pumpkin <speler> [seconden]
    permission: stafftools.staff
  chickenrain:
    description: Laat het kippen regenen boven een speler.
    usage: /chickenrain <speler> [aantal]
    permission: stafftools.staff
  scare:
    description: Laat een speler schrikken (alleen hij hoort/ziet het).
    usage: /scare <speler> [creeper|guardian|ghast|warden]
    permission: stafftools.staff
  announce:
    description: Grote mededeling voor iedereen (chat, titel en geluid).
    usage: /announce <bericht>
    aliases: [mededeling, bc]
    permission: stafftools.staff
  herstart:
    description: Server herstarten met aftellen (ook via /restart). /restart stop = afbreken.
    usage: /restart [tijd] [reden] | stop
    permission: stafftools.staff
  prefix:
    description: Geef een speler een eigen prefix in tab en chat.
    usage: /prefix <set|remove|list> [speler] [prefix]
    permission: stafftools.prefix

permissions:
  stafftools.prefix:
    description: Mag prefixes van spelers instellen en verwijderen.
    default: op
  stafftools.staff:
    description: Telt als "beheer" - krijgt de tag in tab/chat en ziet reports.
    default: op
  stafftools.report:
    description: Mag /report gebruiken.
    default: true
