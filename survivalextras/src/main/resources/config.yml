# SurvivalExtras configuratie
#
# Drie losse onderdelen: nacht overslaan, /tpa en homes. Elk onderdeel kan
# je apart aan- of uitzetten. Gebruik & voor kleurcodes (bv. &e = geel).
# Na het aanpassen: de server herstarten.

sleep:
  enabled: true
  # Hoeveel procent van de spelers in de wereld moet slapen om de nacht over
  # te slaan. 50 = de helft (bij 3 spelers dus 2). Toeschouwers (dode spelers
  # in hardcore) tellen niet mee.
  percentage: 50
  # Hoe lang (seconden) er geslapen moet worden voordat het ochtend wordt (1 t/m 4).
  skip-delay-seconds: 3
  # Wat de slaper op het scherm ziet.
  bed-title: "&9Dikke doei!"
  bed-subtitle: "&7Goeie nachtrust &f☾"
  # Chatbericht voor iedereen in de wereld. {player} {sleeping} {needed}
  bed-message: "&9☾ &f{player} &7gaat slapen. Dikke doei, goeie nachtrust! &8({sleeping}/{needed})"
  # Onderin beeld zolang er mensen slapen.
  actionbar: "&7☾ {sleeping}/{needed} spelers slapen"
  # Als de nacht is overgeslagen.
  morning-title: "&6Goedemorgen!"
  morning-subtitle: "&eDe nacht is overgeslagen ☀"
  morning-message: "&6☀ &eGoedemorgen allemaal! De nacht is overgeslagen."
  # Geluidjes bij het slapen gaan en bij de ochtend.
  sounds: true

tpa:
  enabled: true
  # Hoe lang (seconden) een verzoek geldig blijft.
  expire-seconds: 60
  # Hoe lang (seconden) je stil moet staan voordat je teleporteert. Beweeg je
  # of krijg je schade, dan gaat het niet door. 0 = meteen.
  warmup-seconds: 5
  # Hoe lang (seconden) je na een geslaagde teleport moet wachten voor een nieuw verzoek.
  cooldown-seconds: 30

homes:
  enabled: true
  # Hoeveel homes iedere speler mag hebben.
  max-homes: 2
  # Hoe lang (seconden) je stil moet staan voordat je teleporteert. 0 = meteen.
  warmup-seconds: 5
  # Hoe lang (seconden) je na /home moet wachten voor de volgende /home.
  cooldown-seconds: 30
  # Werelden waar je GEEN home mag zetten (namen van de wereldmappen).
  # De lobby van de LobbySpawn-plugin wordt automatisch uitgesloten als dat een
  # aparte wereld is.
  blocked-worlds: []

banned-items:
  enabled: true
  # Deze wapens zijn uitgeschakeld. Ze kunnen nooit gecraft worden (ook niet in
  # de smeedtafel of de crafter). Namen zoals in /give, zonder "minecraft:".
  items:
    - mace
    - wooden_spear
    - stone_spear
    - copper_spear
    - iron_spear
    - golden_spear
    - diamond_spear
    - netherite_spear
  # false = ook niet te gebruiken, niet op te pakken, mobs krijgen ze niet, en wie
  #         er al een heeft raakt hem kwijt (bij inloggen of na het sluiten van een kist).
  # true  = ALLEEN craften is geblokkeerd; gevonden wapens werken gewoon.
  only-crafting: false
  # Melding onderin beeld als iemand zo'n wapen probeert te gebruiken of op te pakken.
  message: "&cDit wapen is uitgeschakeld op deze server."

# Loot drop-event: na een aftelling landt er ergens een kist met decoratie-hoofden en
# handige spullen (geen echte boosts). Iedereen ziet de coördinaten, een balk bovenin
# beeld en een lichtstraal in de lucht. Eenmalig event plannen (ook in Discord aangekondigd):
# /lootdrop plan 20:00. Meteen: /lootdrop start [tijd], testen: /lootdrop hier [tijd].
loot-drop:
  enabled: true
  # Standaard aftellen (seconden) voordat hij landt.
  countdown-seconds: 300
  # Hoe ver van het midden (deel van de wereldgrens, 0.7 = 70%) en niet dichter bij spawn dan:
  border-fraction: 0.7
  min-distance-from-spawn: 300
  # Na zoveel minuten verdwijnt een kist die nog niet leeg is.
  remove-after-minutes: 30
  # Aantal spullen en decoratie-hoofden in de kist.
  rolls: 7
  heads: 3
  # Ook hoofden van spelers die op dat moment online zijn?
  player-heads: true
  # Decoratie-hoofden (Minecraft-accounts met een skin van een voorwerp).
  decoration-heads:
    - MHF_Present1
    - MHF_Present2
    - MHF_Chest
    - MHF_Cake
    - MHF_Melon
    - MHF_Pumpkin
    - MHF_TNT
    - MHF_Cactus
    - MHF_OakLog
    - MHF_Question
    - MHF_Exclamation
  # Handige spullen: item, aantal (of bereik) en hoe vaak (weight, hoger = vaker).
  loot:
    - {item: TORCH, amount: 16-32, weight: 20}
    - {item: LANTERN, amount: 2-4, weight: 8}
    - {item: BREAD, amount: 4-8, weight: 15}
    - {item: COOKED_BEEF, amount: 3-6, weight: 12}
    - {item: GOLDEN_CARROT, amount: 2-5, weight: 8}
    - {item: COAL, amount: 8-16, weight: 12}
    - {item: IRON_INGOT, amount: 2-5, weight: 10}
    - {item: COPPER_INGOT, amount: 4-10, weight: 8}
    - {item: ARROW, amount: 8-16, weight: 8}
    - {item: BONE_MEAL, amount: 8-16, weight: 8}
    - {item: OAK_SAPLING, amount: 2-4, weight: 5}
    - {item: CHERRY_SAPLING, amount: 1-2, weight: 3}
    - {item: EXPERIENCE_BOTTLE, amount: 3-6, weight: 6}
    - {item: ENDER_PEARL, amount: 1-2, weight: 4}
    - {item: BUCKET, weight: 4}
    - {item: LEAD, amount: 1-2, weight: 4}
    - {item: NAME_TAG, weight: 3}
    - {item: SPYGLASS, weight: 3}
    - {item: COMPASS, weight: 3}
    - {item: CLOCK, weight: 2}
    - {item: BUNDLE, weight: 3}
    - {item: SADDLE, weight: 2}
    - {item: PAINTING, amount: 1-3, weight: 4}
    - {item: CANDLE, amount: 2-4, weight: 4}
    - {item: FLOWER_POT, amount: 1-3, weight: 4}
