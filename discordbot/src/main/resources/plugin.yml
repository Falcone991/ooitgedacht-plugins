name: DiscordBot
version: '1.0.0'
main: com.example.discordbot.DiscordBot
api-version: '1.21'
author: Claude
description: Discord-bot met spelersstatus in het bot-profiel, logs naar een kanaal, en /msg, /kick, /ban, /unban vanuit Discord voor beheer.

commands:
  discord:
    description: Krijg de link naar onze Discord-server.
    usage: /discord

permissions:
  discordbot.seemsg:
    description: Ziet in-game mee als beheer via Discord een speler een bericht stuurt, kickt of verbant.
    default: op
