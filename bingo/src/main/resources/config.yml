# OoitBingo
#
# Beheer start een bingo met /bingo start. Spelers doen mee met /bingo join en krijgen een
# kaart (map) met 9 blokken (3x3). Heb je een blok in je inventory, dan is hij afgevinkt (ook als
# je hem daarna weer gebruikt). Rechtsklik met de kaart = overzicht met de echte blokken.
# Wie als eerste een rij (of de hele kaart, zie win) vol heeft, wint.

# full = de hele kaart vol (alle 9); line = een rij, kolom of diagonaal van 3 vol.
win: full

# Beloning voor de winnaar: zoveel XP-levels.
reward-levels: 30

# Hoeveel blokken van elke moeilijkheid op de kaart (samen 9).
card:
  easy: 4
  medium: 3
  hard: 2

# Ook in Discord aankondigen (via de DiscordBridge-plugin, als die er is).
discord: true

# Blokken per moeilijkheid. Zet ":nether" of ":end" erachter voor blokken die pas mogen
# als die dimensie open is (SurvivalTimeline).
