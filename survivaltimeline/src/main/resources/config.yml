# SurvivalTimeline configuratie
# Alle "weken" hieronder zijn ECHTE weken (real life), gerekend vanaf het
# allereerste moment dat deze plugin op de server werd gestart.

# Na hoeveel weken (real life) de server omschakelt naar hardcore.
# Vóór deze tijd: normaal respawnen. Erna: sterven = permanent (spectator).
weeks-before-hardcore: 3

# In welke week (real life) de Nether opengaat. Portalen naar de Nether
# worden tot die tijd geblokkeerd. "Week 2" = het BEGIN van de tweede week,
# dus 7 dagen na de start (week 1 loopt van dag 0 t/m 6).
nether-open-week: 2

# In welke week (real life) het End opengaat. Portalen naar het End
# worden tot die tijd geblokkeerd. "Week 3" = 14 dagen na de start.
end-open-week: 3

# Met hoeveel blokken de diameter van de wereldgrens groeit per in-game dag
# (1 in-game dag = 24000 ticks, dus ongeveer 20 echte minuten bij normale snelheid).
border-increment-per-ingame-day: 2.0

# De beginwaarde van de wereldgrens (diameter) wanneer de plugin voor het
# eerst wordt gestart. Wordt genegeerd als de grens al eerder is ingesteld.
border-start-size: 6000.0

# Naam van de hoofdwereld waarvan de in-game dag geteld wordt en waarvan
# de wereldgrens wordt aangepast. Leeg laten = automatisch de eerste
# geladen wereld gebruiken (meestal je overworld).
main-world: ""

# Zet aankondigingen (broadcasts) aan/uit voor belangrijke momenten
# (nether open, hardcore geactiveerd, wereldgrens gegroeid).
announce: true

# De finale: vanaf deze week krimpt de wereldgrens elke dag op een vast tijdstip,
# tot er nog maar één speler in leven is. Die wint (titel, vuurwerk, melding voor iedereen).
finale:
  enabled: true
  # In welke week de finale begint (4 = samen met hardcore).
  start-week: 4
  # In hoeveel dagen de grens van zijn grootte bij de start van de finale naar
  # min-size gaat. Elke dag krimpt hij een even groot stuk.
  days: 7
  # Hoe laat hij elke dag krimpt (echte tijd), en in welke tijdzone.
  # Slaapt de server op dat moment, dan krimpt hij zodra de server weer aan gaat.
  shrink-time: "20:00"
  timezone: "Europe/Amsterdam"
  # Zoveel minuten van tevoren krijgt iedereen een waarschuwing (0 = geen).
  warn-minutes: 10
  # Hoe lang (seconden) het krimpen zelf duurt. 1800 = een half uur.
  shrink-seconds: 1800
  # Kleiner dan dit wordt de grens nooit (breedte in blokken).
  min-size: 50
  # Nether en End dicht tijdens de finale; wie er nog is, gaat terug naar de overworld.
  close-nether-end: true
  # Wie tijdens de finale zoveel uur niet online is geweest, ligt eruit (geteld vanaf
  # de start van de finale). Zo hoeft de winnaar niet te wachten op wie weg blijft.
  # Is er niemand meer over (bv. de laatsten gaan tegelijk dood), dan wint wie als laatste afviel.
  inactive-hours: 24
  # Wie terugkomt en buiten de grens staat, krijgt zoveel minuten om naar de grens
  # te lopen zonder grensschade (de verkeerde kant op = schade zoals bij honger).
  # 0 = uit.
  return-grace-minutes: 30
